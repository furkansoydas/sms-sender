{% extends "base.html" %}
{% block title %}Giriş - SMS Sender{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>SMS Sender</h1>
    <p class="subtitle">Hesabınıza giriş yapın</p>
    <form method="POST">
        <div class="form-group">
            <label>Kullanıcı Adı</label>
            <input type="text" name="username" placeholder="kullanici_adi" required autofocus>
        </div>
        <div class="form-group">
            <label>Şifre</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Giriş Yap</button>
    </form>
    <div class="alt-link">
        Hesabınız yok mu? <a href="{{ url_for('register_page') }}">Kayıt ol</a>
    </div>
</div>
{% endblock %}
