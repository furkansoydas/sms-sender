{% extends "base.html" %}
{% block title %}Giris - SMS Sender{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <div class="auth-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h1>Giris Yap</h1>
        <p>Hesabiniza erisim saglayın</p>
    </div>
    <form method="POST" novalidate>
        <div class="form-group">
            <label for="username" class="form-label">Kullanici Adi</label>
            <input type="text" id="username" name="username" class="form-input" placeholder="ornek: admin" required autofocus autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password" class="form-label">Sifre</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="Sifrenizi girin" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-full">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            Giris Yap
        </button>
    </form>
    <div class="auth-footer">
        Hesabiniz yok mu? <a href="{{ url_for('register_page') }}">Kayit ol</a>
    </div>
</div>
{% endblock %}
