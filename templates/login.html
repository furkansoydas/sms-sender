{% extends "base.html" %}
{% from "_auth_carousel.html" import auth_carousel %}
{% block title %}Giris - SMS Sender{% endblock %}
{% block auth_content %}
<div class="auth-layout">
    {{ auth_carousel(active_dot=0) }}
    <div class="auth-form-side">
        <div class="auth-form">
            <h1>Tekrar hosgeldin</h1>
            <p class="sub">Hesabina giris yap ve mesajlarini gonder</p>
            <form method="POST" novalidate>
                <div class="field">
                    <label for="username">Kullanici Adi</label>
                    <input type="text" id="username" name="username" class="input" placeholder="admin" required autofocus autocomplete="username">
                </div>
                <div class="field">
                    <label for="password">Sifre</label>
                    <input type="password" id="password" name="password" class="input" placeholder="Sifrenizi girin" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-accent btn-full">Giris Yap</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
