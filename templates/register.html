{% extends "base.html" %}
{% block title %}Kayit - SMS Sender{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <div class="auth-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        </div>
        <h1>Kayit Ol</h1>
        <p>OTP dogrulamasi icin telefon gerekli</p>
    </div>
    <form method="POST" novalidate>
        <div class="form-group">
            <label for="username" class="form-label">Kullanici Adi</label>
            <input type="text" id="username" name="username" class="form-input" placeholder="ornek: admin" required autofocus autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password" class="form-label">Sifre</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="En az 6 karakter" required autocomplete="new-password">
        </div>
        <div class="form-group">
            <label for="phone" class="form-label">Telefon Numarasi</label>
            <input type="tel" id="phone" name="phone" class="form-input" placeholder="5XX XXX XX XX" required>
            <p class="form-hint">OTP kodu bu numaraya gonderilecek</p>
        </div>
        <button type="submit" class="btn btn-primary btn-full">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
            Kayit Ol
        </button>
    </form>
    <div class="auth-footer">
        Hesabiniz var mi? <a href="{{ url_for('login_page') }}">Giris yap</a>
    </div>
</div>
{% endblock %}
